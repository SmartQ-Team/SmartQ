{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Notifications</h2>
  <form method="post" action="{% url 'notifications_read_all' %}">
    {% csrf_token %}
    <button class="btn btn-primary btn-sm" type="submit">Mark all as read</button>
  </form>
</div>

<div class="list-group shadow-sm">
  {% for n in notifications %}
  <div class="list-group-item {% if not n.read %}list-group-item-info{% endif %}">
    <div class="d-flex justify-content-between">
      <span>{{ n.message }}</span>
      <small class="text-muted">{{ n.created_at|date:"Y-m-d H:i" }}</small>
    </div>
  </div>
  {% empty %}
  <p class="text-muted">No notifications yet.</p>
  {% endfor %}
</div>
{% endblock %}
