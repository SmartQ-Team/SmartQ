{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h3 class="sq-blue mb-0">🔔 Notifications</h3>
    <form method="post" action="{% url 'notifications_read_all' %}">
      {% csrf_token %}
      <button class="btn btn-sm btn-gold">Mark all as read</button>
    </form>
  </div>

  <div class="card sq-card">
    <div class="list-group list-group-flush">
      {% for n in notifications %}
      <div class="list-group-item d-flex justify-content-between align-items-start {% if not n.read %}bg-warning bg-opacity-10{% endif %}">
        <div>
          <p class="mb-1">{{ n.message }}</p>
          <small class="text-muted">{{ n.created_at|date:'d M Y, H:i' }}</small>
        </div>
        {% if not n.read %}
        <span class="badge rounded-pill text-dark" style="background:#FFB81C;">New</span>
        {% endif %}
      </div>
      {% empty %}
      <div class="list-group-item text-muted text-center py-4">No notifications yet.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
